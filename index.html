<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>MICCHO TERMINAL</title>
<style>
:root{--cy:#e7e047;--ink:#fbf9e8;--dim:#948f6e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0b06;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(120% 70% at 50% 30%,#262910 0%,#12140a 50%,#050503 100%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px)}
.box{width:100%;max-width:340px;text-align:center;position:relative;z-index:1}
.mono{font-family:ui-monospace,Menlo,monospace}
.eye{font-size:10px;letter-spacing:.34em;color:var(--cy);margin-bottom:10px}
h1{margin:0 0 6px;font-size:20px;letter-spacing:.16em}
p{margin:0 0 26px;font-size:12px;line-height:1.8;color:var(--dim)}
input{width:100%;font:inherit;font-size:18px;letter-spacing:.2em;text-align:center;padding:14px 12px;
  color:var(--ink);background:rgba(24,26,11,.9);border:1px solid rgba(231,224,71,.45);border-radius:2px;
  caret-color:var(--cy);outline:none}
input:focus{border-color:var(--cy);box-shadow:0 0 0 1px rgba(231,224,71,.4)}
button{width:100%;margin-top:12px;font:inherit;font-size:14px;letter-spacing:.3em;padding:14px 0;
  color:#141405;background:var(--cy);border:0;border-radius:2px;cursor:pointer;font-weight:700}
button:disabled{opacity:.5}
.err{min-height:20px;margin-top:12px;font-size:12px;color:#ff8a7a}
.box.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>
<body>

</form>

const K = "panja.gate";
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.normalize("NFKC").trim().toLowerCase();
async function unlock(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:b(P.s), iterations:P.i, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b(P.n) }, key, b(P.d));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function tryOpen(pw, silent){
  try{
    const html = await unlock(pw);
    try{ localStorage.setItem(K, pw); }catch(e){}
    show(html); return true;
  }catch(e){
    if(!silent){
      document.getElementById("err").textContent = "コードが違います";
      const f = document.getElementById("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    }
    return false;
  }
}
if(!(window.crypto && crypto.subtle)){
  document.getElementById("err").textContent = "https:// から始まるURLで開いてください";
  document.getElementById("go").disabled = true;
}else{
  let saved = null; try{ saved = localStorage.getItem(K); }catch(e){}
  if(saved) tryOpen(saved, true);
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const go = document.getElementById("go"); go.disabled = true; go.textContent = "…";
    document.getElementById("err").textContent = "";
    const ok = await tryOpen(document.getElementById("pw").value, false);
    if(!ok){ go.disabled = false; go.textContent = "ACCESS"; }
  });
}
})();
